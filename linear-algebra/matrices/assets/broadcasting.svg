<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img" aria-label="Row broadcasting repeats a row vertically; column broadcasting repeats a column horizontally"><rect width="920" height="350" fill="#f8fafc"/><text x="28" y="43" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17343a">NumPy broadcasting: dimension of size 1 expands</text><g font-family="Arial,sans-serif" fill="#17343a"><text x="45" y="98" font-size="23" font-weight="700">Row broadcasting</text><text x="480" y="98" font-size="23" font-weight="700">Column broadcasting</text></g><rect x="45" y="121" width="130" height="65" rx="12" fill="#d9edf9"/><rect x="235" y="119" width="166" height="167" rx="12" fill="#e0f4ee"/><g fill="#17343a" font-family="Arial,sans-serif" font-size="22"><text x="62" y="162">2</text><text x="120" y="162">3</text><text x="205" y="161">→</text><text x="259" y="160">2</text><text x="334" y="160">3</text><text x="259" y="211">2</text><text x="334" y="211">3</text><text x="259" y="262">2</text><text x="334" y="262">3</text></g><text x="45" y="310" font-family="Arial" font-size="19" fill="#45616a">(1,2) expands to (3,2)</text><rect x="508" y="121" width="72" height="130" rx="12" fill="#d9edf9"/><rect x="644" y="119" width="234" height="132" rx="12" fill="#e0f4ee"/><g fill="#17343a" font-family="Arial" font-size="22"><text x="533" y="165">1</text><text x="533" y="219">2</text><text x="610" y="188">→</text><text x="673" y="165">1</text><text x="755" y="165">1</text><text x="833" y="165">1</text><text x="673" y="219">2</text><text x="755" y="219">2</text><text x="833" y="219">2</text></g><text x="508" y="310" font-family="Arial" font-size="19" fill="#45616a">(2,1) expands to (2,3)</text></svg>