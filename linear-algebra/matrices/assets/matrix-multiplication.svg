<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-label="Matrix multiplication: highlighted row times highlighted column gives 19"><rect width="900" height="290" fill="#f8fafc"/><text x="32" y="45" fill="#142b38" font-family="Arial,sans-serif" font-size="27" font-weight="700">Matrix multiplication = row dot column</text><rect x="30" y="85" width="225" height="148" rx="16" fill="#e5f6f1" stroke="#218678" stroke-width="2"/><rect x="45" y="97" width="195" height="60" rx="10" fill="#b9e6db"/><text x="85" y="140" fill="#12362e" font-family="Arial" font-size="33">1</text><text x="175" y="140" fill="#12362e" font-family="Arial" font-size="33">2</text><text x="85" y="203" fill="#12362e" font-family="Arial" font-size="33">3</text><text x="175" y="203" fill="#12362e" font-family="Arial" font-size="33">4</text><text x="264" y="161" font-family="Arial" font-size="36" fill="#142b38">×</text><rect x="310" y="85" width="225" height="148" rx="16" fill="#ebf2fc" stroke="#426eae" stroke-width="2"/><rect x="320" y="96" width="97" height="126" rx="10" fill="#c5d9fb"/><text x="350" y="140" fill="#193d70" font-family="Arial" font-size="33">5</text><text x="450" y="140" fill="#193d70" font-family="Arial" font-size="33">6</text><text x="350" y="203" fill="#193d70" font-family="Arial" font-size="33">7</text><text x="450" y="203" fill="#193d70" font-family="Arial" font-size="33">8</text><text x="551" y="161" font-family="Arial" font-size="36" fill="#142b38">=</text><rect x="594" y="85" width="270" height="148" rx="16" fill="#fff" stroke="#b4c3cd" stroke-width="2"/><rect x="607" y="96" width="117" height="60" rx="10" fill="#fce8c8"/><g fill="#142b38" font-family="Arial" font-size="32"><text x="631" y="140">19</text><text x="755" y="140">22</text><text x="631" y="203">43</text><text x="755" y="203">50</text></g><text x="30" y="267" font-family="Arial" font-size="21" fill="#142b38">Top-left = (1 × 5) + (2 × 7) = 19. Repeat for the other three positions.</text></svg>