name: Generate trigonometry PNG
on:
  push:
    branches: [main]
    paths: ['scripts/generate_trig_png.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python scripts/generate_trig_png.py trigonometry/assets/trigonometry_normal_inverse.png
      - name: Commit generated PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trigonometry/assets/trigonometry_normal_inverse.png
          if ! git diff --cached --quiet; then
            git commit -m "Add generated normal and inverse trigonometry PNG"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
